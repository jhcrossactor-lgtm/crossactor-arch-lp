<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>01 NEURAL FIELD — CROSSACTOR HERO LAB</title>
<link rel="stylesheet" href="lab.css">
<style>
  :root{ --accent:#6ee7ff; }
  body{ background:#03040a; }
  .stage{ background:radial-gradient(1200px 800px at 70% 40%, #0c1236 0%, #05060f 55%, #020308 100%); }
  #c{ position:absolute; inset:0; z-index:1; width:100%; height:100%; cursor:crosshair; }
  /* 文字側だけ暗くする */
  .stage::after{
    content:""; position:absolute; inset:0; z-index:2; pointer-events:none;
    background:linear-gradient(90deg, rgba(3,4,10,.86) 0%, rgba(3,4,10,.42) 36%, rgba(3,4,10,0) 58%);
  }
  .eyebrow{ color:#7fe3ff; }
  .grad{ background:linear-gradient(95deg, #6ee7ff, #a78bfa 55%, #f0abfc); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .btn--solid{ box-shadow:0 12px 40px -12px rgba(110,231,255,.8); }
  .lab-nav__cta{ color:#6ee7ff; }

  .hud{
    position:absolute; z-index:4; right:var(--edge); top:96px;
    font-family:var(--mono); font-size:11px; letter-spacing:.14em; line-height:2.1; text-align:right;
    color:rgba(160,220,255,.62);
  }
  .hud b{ font-weight:400; color:#fff; }
  .hud__state::before{
    content:""; display:inline-block; width:6px; height:6px; margin-right:8px; border-radius:50%;
    background:#6ee7ff; box-shadow:0 0 10px #6ee7ff; animation:blink 1.2s infinite;
  }
  @keyframes blink{ 50%{ opacity:.2; } }
  .hint{
    position:absolute; z-index:4; right:var(--edge); bottom:84px; margin:0;
    font-family:var(--mono); font-size:10px; letter-spacing:.24em; color:rgba(255,255,255,.38);
  }
  @media (max-width:760px){
    .stage::after{ background:linear-gradient(180deg, rgba(3,4,10,0) 38%, rgba(3,4,10,.88) 68%); }
    .hud{ top:70px; font-size:10px; }
    .hint{ display:none; }
  }
</style>
</head>
<body>

<header class="lab-nav">
  <a class="lab-nav__logo" href="index.html"><img src="../assets/logo-light.png" alt="CROSSACTOR" width="618" height="314"></a>
  <nav class="lab-nav__links" aria-label="ページ内リンク"><a href="#">Services</a><a href="#">3D VR</a><a href="#">Web</a><a href="#">AI</a></nav>
  <a class="lab-nav__cta" href="#">無料で相談</a>
</header>

<section class="stage">
  <canvas id="c" aria-hidden="true"></canvas>
  <div class="hud" aria-hidden="true">
    <div>NODES <b id="h-nodes">0</b></div>
    <div>LINKS <b id="h-links">0</b></div>
    <div class="hud__state" id="h-state">LEARNING</div>
  </div>

  <div class="copy">
    <p class="eyebrow rise" style="--d:.05s">AI INNOVATION STUDIO</p>
    <h1 class="title rise" style="--d:.15s">考える線が、<br><span class="grad">かたちになる。</span></h1>
    <p class="lead rise" style="--d:.28s">AIと設計の視点で、建築・Web・業務の「こうしたい」を、見て触れる体験に変えるスタジオです。</p>
    <div class="actions rise" style="--d:.4s">
      <a class="btn btn--solid" href="#">無料で相談する →</a>
      <a class="btn btn--ghost" href="#">サービスを見る</a>
    </div>
  </div>
  <p class="hint" aria-hidden="true">MOVE TO CONNECT ／ CLICK TO SEND A SIGNAL</p>
</section>

<script src="lab.js"></script>
<script>
/* 粒子のニューラルネット：漂ってつながる → ときどき文字に集まる → またほどける */
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const hud = { nodes: document.getElementById('h-nodes'), links: document.getElementById('h-links'), state: document.getElementById('h-state') };
  const WORDS = ['AI', '3D VR', 'WEB'];
  const COLORS = ['#6ee7ff', '#a5b4fc', '#f0abfc'];
  const rand = (a, b) => a + Math.random() * (b - a);

  let W = 0, H = 0, narrow = false;
  let parts = [], mode = 'drift', modeStart = performance.now(), word = 0, linkCount = 0;
  const pulses = [], signals = [];
  const mouse = { x: -1e4, y: -1e4 };

  function resize () {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight; narrow = W < 760;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(Math.min(640, Math.max(240, (W * H) / 2600)));
    while (parts.length < n) parts.push({ x: rand(0, W), y: rand(0, H), vx: rand(-0.3, 0.3), vy: rand(-0.3, 0.3), tx: null, ty: null, s: rand(0.8, 2), c: 0 });
    parts.length = n;
    if (mode === 'form') assign();
  }

  // 文字を裏のキャンバスに描いて、塗られた画素の位置を集合地点にする
  function sample (text) {
    const box = narrow
      ? { x: W * 0.06, y: H * 0.12, w: W * 0.88, h: H * 0.3 }
      : { x: W * 0.44, y: H * 0.18, w: W * 0.52, h: H * 0.52 };
    const off = document.createElement('canvas');
    off.width = Math.max(1, Math.round(box.w)); off.height = Math.max(1, Math.round(box.h));
    const o = off.getContext('2d');
    let fs = off.height * 0.8;
    const setFont = () => { o.font = `700 ${fs}px "Space Mono", monospace`; };
    setFont();
    while (o.measureText(text).width > off.width * 0.94 && fs > 10) { fs *= 0.92; setFont(); }
    o.fillStyle = '#fff'; o.textAlign = 'center'; o.textBaseline = 'middle';
    o.fillText(text, off.width / 2, off.height / 2);
    const data = o.getImageData(0, 0, off.width, off.height).data;
    const step = Math.max(3, Math.round(Math.sqrt((off.width * off.height * 0.2) / parts.length)));
    const pts = [];
    for (let y = 0; y < off.height; y += step)
      for (let x = 0; x < off.width; x += step)
        if (data[(y * off.width + x) * 4 + 3] > 140) pts.push([box.x + x, box.y + y]);
    for (let i = pts.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [pts[i], pts[j]] = [pts[j], pts[i]]; }
    return pts;
  }

  function assign () {
    const pts = sample(WORDS[word]);
    parts.forEach((p, i) => {
      const t = pts[i];
      p.tx = t ? t[0] : null; p.ty = t ? t[1] : null;
      p.c = t ? Math.min(2, Math.floor(((t[0] - (narrow ? 0 : W * 0.44)) / (narrow ? W : W * 0.52)) * 3)) : 0;
    });
  }

  function update (dt, now) {
    const el = now - modeStart;
    if (mode === 'drift' && el > 4200) {
      mode = 'form'; modeStart = now; assign();
      hud.state.textContent = `THINKING : ${WORDS[word]}`;
    } else if (mode === 'form' && el > 3400) {
      mode = 'drift'; modeStart = now;
      parts.forEach(p => { p.tx = null; p.vx += rand(-1.6, 1.6); p.vy += rand(-1.6, 1.6); });
      word = (word + 1) % WORDS.length;
      hud.state.textContent = 'LEARNING';
    }

    for (const p of parts) {
      if (p.tx != null) {
        p.vx += (p.tx - p.x) * 0.012; p.vy += (p.ty - p.y) * 0.012;
        p.vx *= 0.86; p.vy *= 0.86;
      } else {
        p.vx += rand(-0.03, 0.03); p.vy += rand(-0.03, 0.03);
        p.vx *= 0.985; p.vy *= 0.985;
        const sp = Math.hypot(p.vx, p.vy);
        if (sp > 1.3) { p.vx *= 1.3 / sp; p.vy *= 1.3 / sp; }
        const dx = p.x - mouse.x, dy = p.y - mouse.y, d = Math.hypot(dx, dy);
        if (d < 110 && d > 0.1) { p.vx += (dx / d) * 0.25 * (1 - d / 110); p.vy += (dy / d) * 0.25 * (1 - d / 110); }
      }
      for (const u of pulses) {
        const dx = p.x - u.x, dy = p.y - u.y, d = Math.hypot(dx, dy);
        if (Math.abs(d - u.r) < 28 && d > 0.1) { p.vx += (dx / d) * 2; p.vy += (dy / d) * 2; }
      }
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.tx == null) {
        if (p.x < -20) p.x = W + 20; else if (p.x > W + 20) p.x = -20;
        if (p.y < -20) p.y = H + 20; else if (p.y > H + 20) p.y = -20;
      }
    }
    for (let i = pulses.length - 1; i >= 0; i--) { pulses[i].r += 7 * dt; pulses[i].a -= 0.018 * dt; if (pulses[i].a <= 0) pulses.splice(i, 1); }
  }

  function draw () {
    ctx.clearRect(0, 0, W, H);
    const L = mode === 'form' ? 20 : narrow ? 70 : 94;
    const grid = new Map();
    parts.forEach((p, i) => {
      const k = `${Math.floor(p.x / L)},${Math.floor(p.y / L)}`;
      if (!grid.has(k)) grid.set(k, []);
      grid.get(k).push(i);
    });

    // 線は透明度ごとにまとめて描く（1本ずつ色を変えると重い）
    const buckets = [new Path2D(), new Path2D(), new Path2D(), new Path2D()];
    const alphas = [0.5, 0.3, 0.16, 0.07];
    linkCount = 0;
    const L2 = L * L;
    parts.forEach((p, i) => {
      const cx = Math.floor(p.x / L), cy = Math.floor(p.y / L);
      for (let gx = cx - 1; gx <= cx + 1; gx++) for (let gy = cy - 1; gy <= cy + 1; gy++) {
        const cell = grid.get(`${gx},${gy}`);
        if (!cell) continue;
        for (const j of cell) {
          if (j <= i) continue;
          const q = parts[j];
          const dx = p.x - q.x, dy = p.y - q.y, d2 = dx * dx + dy * dy;
          if (d2 > L2) continue;
          const b = Math.min(3, Math.floor((Math.sqrt(d2) / L) * 4));
          buckets[b].moveTo(p.x, p.y); buckets[b].lineTo(q.x, q.y);
          linkCount++;
          if (signals.length < 14 && Math.random() < 0.00025) signals.push({ a: p, b: q, t: 0 });
        }
      }
    });
    ctx.lineWidth = 1;
    buckets.forEach((path, b) => { ctx.strokeStyle = `rgba(120,210,255,${alphas[b]})`; ctx.stroke(path); });

    // カーソルへ伸びる線
    if (mouse.x > -1e3) {
      const path = new Path2D();
      for (const p of parts) {
        const d = Math.hypot(p.x - mouse.x, p.y - mouse.y);
        if (d < 170) { path.moveTo(mouse.x, mouse.y); path.lineTo(p.x, p.y); }
      }
      ctx.strokeStyle = 'rgba(200,165,255,.28)';
      ctx.stroke(path);
    }

    // 粒
    const size = mode === 'form' ? 1.7 : 1;
    for (let c = 0; c < 3; c++) {
      ctx.fillStyle = COLORS[c];
      for (const p of parts) {
        const pc = p.tx != null ? p.c : Math.min(2, Math.floor((p.x / W) * 3));
        if (pc !== c) continue;
        ctx.fillRect(p.x - p.s * size / 2, p.y - p.s * size / 2, p.s * size, p.s * size);
      }
    }

    // 線を伝う信号
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#6ee7ff'; ctx.shadowBlur = 14;
    for (let i = signals.length - 1; i >= 0; i--) {
      const s = signals[i];
      s.t += 0.035;
      if (s.t >= 1) { signals.splice(i, 1); continue; }
      const x = s.a.x + (s.b.x - s.a.x) * s.t, y = s.a.y + (s.b.y - s.a.y) * s.t;
      ctx.beginPath(); ctx.arc(x, y, 2.2, 0, Math.PI * 2); ctx.fill();
    }
    ctx.shadowBlur = 0;

    for (const u of pulses) {
      ctx.strokeStyle = `rgba(180,150,255,${Math.max(0, u.a)})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(u.x, u.y, u.r, 0, Math.PI * 2); ctx.stroke();
    }
  }

  let last = performance.now(), hudAt = 0;
  function loop (now) {
    const dt = Math.min((now - last) / 16.667, 3); last = now;
    update(dt, now); draw();
    if (now - hudAt > 250) { hud.nodes.textContent = parts.length.toLocaleString(); hud.links.textContent = linkCount.toLocaleString(); hudAt = now; }
    requestAnimationFrame(loop);
  }

  const stage = cv.parentElement;
  stage.addEventListener('pointermove', e => { const r = cv.getBoundingClientRect(); mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top; });
  stage.addEventListener('pointerleave', () => { mouse.x = mouse.y = -1e4; });
  cv.addEventListener('click', e => {
    const r = cv.getBoundingClientRect();
    pulses.push({ x: e.clientX - r.left, y: e.clientY - r.top, r: 4, a: 0.9 });
  });
  window.addEventListener('resize', resize);

  document.fonts.load('700 40px "Space Mono"').finally(() => {
    resize();
    if (reduce) {
      mode = 'form'; assign(); parts.forEach(p => { if (p.tx != null) { p.x = p.tx; p.y = p.ty; } });
      draw(); hud.state.textContent = 'AI';
      return;
    }
    requestAnimationFrame(loop);
  });
})();
</script>
</body>
</html>
